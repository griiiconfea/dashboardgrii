// UTILS
// ═══════════════════════════════════════════
function g(id){return document.getElementById(id);}
function setHoje(id){
  const t=new Date();
  g(id).value=String(t.getDate()).padStart(2,'0')+'/'+String(t.getMonth()+1).padStart(2,'0')+'/'+t.getFullYear();
}
function mdate(input){
  let v=input.value.replace(/\D/g,'');
  if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);
  if(v.length>=6)v=v.slice(0,5)+'/'+v.slice(5);
  input.value=v.slice(0,10);
}
function validBR(s){
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(s))return false;
  const p=s.split('/').map(Number);
  const dt=new Date(p[2],p[1]-1,p[0]);
  return dt.getDate()===p[0]&&dt.getMonth()===p[1]-1&&dt.getFullYear()===p[2];
}
function parseBR(s){
  if(!s||!/^\d{2}\/\d{2}\/\d{4}$/.test(s))return null;
  const p=s.split('/').map(Number);return new Date(p[2],p[1]-1,p[0]);
}
function fmtBR(iso){
  if(!iso)return '—';
  try{return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
  catch{return iso;}
}
function updPr(val){
  val=parseInt(val)||0;
  if(g('prLbl'))g('prLbl').textContent=val+'%';
  if(g('prPct'))g('prPct').textContent=val+'%';
  const sel=g('amSta');if(!sel)return;
  if(val>=100)sel.value='concluido';
  else if(val>0)sel.value='em andamento';
  else sel.value='pendente';
}
function toast(msg,type){
  type=type||'in';
  const t=document.createElement('div');
  t.className='toast '+type;t.textContent=msg;
  g('tst').appendChild(t);
  setTimeout(()=>t.remove(),3200);
}

// ════════ PALETA DE COMANDO (Ctrl/Cmd + K) — aditivo ════════
(function(){
  let box,input,list,items=[],sel=0;
  function build(){
    const ov=document.createElement('div');ov.id='cmdk';
    ov.innerHTML='<div class="cmdk-box">'+
      '<input class="cmdk-in" id="cmdkIn" placeholder="Buscar seção, ação ou comando…" autocomplete="off">'+
      '<div class="cmdk-list" id="cmdkList"></div>'+
      '<div class="cmdk-hint"><span>↑ ↓ navegar</span><span>↵ abrir</span><span>esc fechar</span></div>'+
    '</div>';
    document.body.appendChild(ov);
    box=ov;input=ov.querySelector('#cmdkIn');list=ov.querySelector('#cmdkList');
    ov.addEventListener('click',e=>{if(e.target===ov)close();});
    input.addEventListener('input',render);
    input.addEventListener('keydown',nav);
  }
  function sources(){
    const out=[];
    out.push({t:'Dashboard',s:'Visão geral',go:()=>sv('dash')});
    out.push({t:'Minhas Ações',s:'Atribuídas a mim',go:()=>sv('minhas')});
    out.push({t:'Arquivadas',s:'Histórico',go:()=>sv('arq')});
    if(CU&&CU.role==='admin')out.push({t:'Administração',s:'Usuários',go:()=>sv('admin')});
    out.push({t:'+ Nova Ação',s:'Criar',go:()=>openAM()});
    TREE.children.forEach(s=>out.push({t:s.label,s:'Painel',go:()=>sv('planner',s.id)}));
    allNodes().forEach(n=>out.push({t:n.label,s:(nodePath(n.id).slice(1,-1).join(' › ')||'Seção'),go:()=>sv('node',n.id)}));
    return out;
  }
  function render(){
    const q=(input.value||'').toLowerCase().trim();
    const all=sources();
    items=(q?all.filter(o=>(o.t+' '+o.s).toLowerCase().includes(q)):all).slice(0,40);
    sel=0;
    list.innerHTML=items.map((o,i)=>'<div class="cmdk-it'+(i===0?' sel':'')+'" data-i="'+i+'">'+
      '<span>'+o.t+'</span><small>'+o.s+'</small></div>').join('')||
      '<div class="cmdk-it" style="cursor:default">Nada encontrado</div>';
    list.querySelectorAll('.cmdk-it[data-i]').forEach(el=>{el.onclick=()=>choose(+el.dataset.i);});
  }
  function mark(){list.querySelectorAll('.cmdk-it[data-i]').forEach((el,i)=>el.classList.toggle('sel',i===sel));}
  function scroll(){const el=list.querySelector('.cmdk-it.sel');if(el)el.scrollIntoView({block:'nearest'});}
  function nav(e){
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,items.length-1);mark();scroll();}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);mark();scroll();}
    else if(e.key==='Enter'){e.preventDefault();choose(sel);}
    else if(e.key==='Escape'){e.preventDefault();close();}
  }
  function choose(i){const o=items[i];if(!o)return;close();o.go();}
  function open(){if(!box)build();box.classList.add('open');input.value='';render();setTimeout(()=>input.focus(),30);}
  function close(){if(box)box.classList.remove('open');}
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){
      if(typeof CU==='undefined'||!CU)return;   // só funciona logado
      e.preventDefault();
      (box&&box.classList.contains('open'))?close():open();
    }
  });
