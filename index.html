<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CONFEA · GRII — Planner &amp; Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --P:#0A2558; --P-2:#1B3A7A; --P-3:#3553A0;
  --P-soft:#EEF1F8; --P-glass:rgba(10,37,88,.04);
  --G:#C4952A; --G-2:#E8C063; --G-soft:#FAF3DE;
  --BG:#F6F8FC; --SF:#FFFFFF; --SF-2:#FAFBFE;
  --BD:#E6EAF2; --BD-2:#F0F3F8;
  --TX:#0F172A; --TX-2:#334155; --TM:#64748B; --TM-2:#94A3B8;
  --OK:#15803D; --OK-BG:#ECFDF5; --OK-BD:#A7F3D0;
  --WN:#A16207; --WN-BG:#FEFCE8; --WN-BD:#FDE68A;
  --ER:#B91C1C; --ER-BG:#FEF2F2; --ER-BD:#FCA5A5;
  --IN:#1D4ED8; --IN-BG:#EFF6FF; --IN-BD:#BFDBFE;
  --PN:#5B21B6; --PN-BG:#F5F3FF; --PN-BD:#DDD6FE;
  --CA:#9D174D; --CA-BG:#FDF2F8; --CA-BD:#FBCFE8;
  --SW:272px; --SH:64px;
  --R:14px; --R-md:10px; --R-sm:8px; --R-xs:6px;
  --SH1:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.05);
  --SH2:0 4px 12px rgba(15,23,42,.06), 0 2px 4px rgba(15,23,42,.04);
  --SH3:0 12px 28px rgba(15,23,42,.10), 0 4px 8px rgba(15,23,42,.05);
  --ring:0 0 0 3px rgba(10,37,88,.12);
  --E:cubic-bezier(.4,0,.2,1);
  --T:.18s var(--E);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter','DM Sans',-apple-system,sans-serif;
  background:var(--BG);color:var(--TX);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
h1,h2,h3{font-family:'Fraunces','Inter',serif;line-height:1.25;letter-spacing:-.01em}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D6DCE8;border-radius:8px;border:2px solid var(--BG)}
::-webkit-scrollbar-thumb:hover{background:#B4BDD0}

/* LOGIN */
#L{display:flex;align-items:center;justify-content:center;min-height:100vh;
   position:fixed;inset:0;z-index:9999;transition:opacity .3s,visibility .3s;
   background:
     radial-gradient(circle at 18% 12%, rgba(196,149,42,.18), transparent 42%),
     radial-gradient(circle at 82% 88%, rgba(53,83,160,.32), transparent 48%),
     linear-gradient(140deg,#06143A 0%,#0A2558 55%,#1B3A7A 100%);}
#L.gone{opacity:0;visibility:hidden;pointer-events:none}
.lcard{background:rgba(255,255,255,.98);border-radius:20px;padding:42px 38px;
  width:400px;max-width:92vw;
  box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:center;gap:22px;
  backdrop-filter:blur(20px)}
.logo-img{height:52px;object-fit:contain}
.logo-fb{color:var(--G);font-family:'Fraunces',serif;font-size:28px;font-weight:700}
.ltitle{text-align:center}
.ltitle h1{font-size:20px;color:var(--P);font-weight:600}
.ltitle p{color:var(--TM);font-size:13px;margin-top:5px}
.fgrp{width:100%;display:flex;flex-direction:column;gap:7px}
.fgrp label{font-size:11px;font-weight:600;color:var(--TM);
  text-transform:uppercase;letter-spacing:.07em}
.fgrp input{width:100%;padding:12px 14px;border:1.5px solid var(--BD);
  border-radius:var(--R-md);font-size:14px;outline:none;
  transition:all var(--T);background:var(--SF-2);color:var(--TX)}
.fgrp input:focus{border-color:var(--P);background:var(--SF);box-shadow:var(--ring)}
.lerr{color:var(--ER);font-size:13px;text-align:center;display:none;
  background:var(--ER-BG);padding:9px;border-radius:var(--R-sm);width:100%}

/* BOTOES */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;
  border-radius:var(--R-md);font-size:13px;font-weight:500;
  transition:all var(--T);white-space:nowrap;cursor:pointer}
.btn-P{background:var(--P);color:#fff;box-shadow:0 1px 2px rgba(10,37,88,.18)}
.btn-P:hover{background:var(--P-2);transform:translateY(-1px);box-shadow:0 4px 10px rgba(10,37,88,.22)}
.btn-out{background:transparent;color:var(--P);border:1.5px solid var(--BD)}
.btn-out:hover{background:var(--P);color:#fff;border-color:var(--P)}
.btn-gh{background:transparent;color:var(--TM-2)}
.btn-gh:hover{background:var(--P-soft);color:var(--TX)}
.btn-er{background:var(--ER-BG);color:var(--ER);border:1.5px solid var(--ER-BD)}
.btn-er:hover{background:var(--ER);color:#fff}
.btn-ok{background:var(--OK-BG);color:var(--OK);border:1.5px solid var(--OK-BD)}
.btn-ok:hover{background:var(--OK);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-lg{padding:13px 22px;font-size:14.5px;width:100%;justify-content:center;font-weight:600}

/* APP SHELL */
#A{display:none;height:100vh;overflow:hidden}
#A.vis{display:flex}

/* SIDEBAR */
.sb{width:var(--SW);min-width:var(--SW);display:flex;flex-direction:column;
  height:100vh;overflow:hidden;color:#fff;position:relative;
  background:linear-gradient(180deg,#06143A 0%,#0A2558 100%)}
.sb::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 0%, rgba(196,149,42,.10),transparent 55%)}
.sb-hd{padding:24px 18px 18px;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center}
.sb-hd::after{content:"";position:absolute;bottom:0;left:18px;right:18px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.sb-logo{height:42px;object-fit:contain}
.sb-logo-fb{color:var(--G);font-family:'Fraunces',serif;font-size:18px;font-weight:700}
.sb-bname{color:#fff;font-size:15px;font-weight:700}
.sb-bsub{color:rgba(255,255,255,.5);font-size:9.5px;line-height:1.55;
  letter-spacing:.07em;text-transform:uppercase;font-weight:500}
.sb-nav{flex:1;overflow-y:auto;padding:8px 10px 12px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}

.ni{display:flex;align-items:center;gap:8px;padding:8px 12px;user-select:none;
  color:rgba(255,255,255,.78);font-size:13px;
  border-radius:var(--R-sm);margin:1px 0;
  transition:all var(--T);position:relative;cursor:default}
.ni.clickable{cursor:pointer}
.ni.clickable:hover{background:rgba(255,255,255,.06);color:#fff}
.ni.act{background:rgba(196,149,42,.16);color:#fff;font-weight:600}
.ni.act::before{content:"";position:absolute;left:-4px;top:6px;bottom:6px;width:3px;
  background:var(--G);border-radius:0 3px 3px 0}

.ni.lv1-sec{font-weight:700;font-size:11px;text-transform:uppercase;
  letter-spacing:.09em;color:rgba(255,255,255,.55);
  padding:11px 12px 8px;margin-top:8px;cursor:pointer}
.ni.lv1-sec:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.04)}
.ni.lv1-sec.act{background:rgba(196,149,42,.16);color:var(--G-2)}
.ni.lv1-sec .sec-hint{font-size:9.5px;font-weight:500;
  color:rgba(255,255,255,.35);text-transform:none;letter-spacing:.02em;margin-left:auto}
.ni.lv1-sec.act .sec-hint{color:rgba(232,192,99,.75)}

.ni.lv1{font-weight:500;color:rgba(255,255,255,.92);font-size:13.5px}
.ni.lv1 .ni-ico{width:14px;height:14px;opacity:.75;flex-shrink:0;display:inline-flex}
.ni.lv1 .ni-ico svg{width:100%;height:100%}

.ni.lv2{padding-left:24px;font-size:12.5px;cursor:pointer}
.ni.lv3{padding-left:38px;font-size:12px;cursor:pointer;color:rgba(255,255,255,.66)}
.ni.lv4{padding-left:54px;font-size:11.5px;cursor:pointer;color:rgba(255,255,255,.58)}
.ni.lv2::after,.ni.lv3::after,.ni.lv4::after{
  content:"";position:absolute;left:14px;top:0;bottom:0;width:1px;
  background:rgba(255,255,255,.07)}
.ni.lv3::after{left:28px}
.ni.lv4::after{left:42px}

.ni-arr{margin-left:auto;font-size:9px;transition:transform var(--T);
  color:rgba(255,255,255,.32);font-weight:bold}
.ni.open>.ni-arr{transform:rotate(90deg);color:var(--G)}
.nc{display:none}.nc.open{display:block;animation:exp .25s var(--E)}
@keyframes exp{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.nb{margin-left:auto;background:rgba(196,149,42,.22);color:var(--G-2);
  font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;flex-shrink:0}
.sep-sb{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  margin:10px 6px}

.sb-ft{padding:12px 12px 14px;position:relative}
.sb-ft::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.uinfo{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px;
  border-radius:var(--R-sm);transition:all var(--T)}
.uinfo:hover{background:rgba(255,255,255,.06)}
.uav{width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--G),var(--G-2));color:#06143A;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
  box-shadow:0 2px 6px rgba(196,149,42,.32)}
.uname{color:#fff;font-size:13px;font-weight:600;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urole{color:rgba(255,255,255,.5);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.logout-b{color:rgba(255,255,255,.4);padding:6px;border-radius:var(--R-sm);
  display:inline-flex;align-items:center}
.logout-b:hover{color:var(--G-2);background:rgba(255,255,255,.08)}
.logout-b svg{width:15px;height:15px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--BG)}
.topbar{height:var(--SH);background:var(--SF);
  padding:0 26px;display:flex;align-items:center;gap:14px;
  border-bottom:1px solid var(--BD);position:relative;z-index:5}
.bc{flex:1;display:flex;align-items:center;gap:6px;font-size:13.5px;
  color:var(--TM);flex-wrap:wrap;font-weight:500}
.bc .cur{color:var(--TX);font-weight:600}
.bc .sep{color:var(--BD);font-size:11px}
.ta{display:flex;align-items:center;gap:8px;flex-shrink:0}

.fbar{background:var(--SF);border-bottom:1px solid var(--BD);
  padding:9px 26px;display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;flex-shrink:0;font-size:12px}
.fbar label{font-size:10.5px;font-weight:600;color:var(--TM);
  text-transform:uppercase;letter-spacing:.06em}
.fbar select,.fbar input[type=date],.fbar input[type=text]{padding:6px 11px;
  border:1.5px solid var(--BD);border-radius:var(--R-sm);font-size:12.5px;
  color:var(--TX);background:var(--SF-2);outline:none;font-family:inherit;
  transition:all var(--T)}
.fbar select:focus,.fbar input[type=date]:focus,.fbar input[type=text]:focus{
  border-color:var(--P);background:var(--SF);box-shadow:var(--ring)}
.fbar-active{background:linear-gradient(180deg,#EEF3FC,var(--SF));border-bottom-color:var(--P-3)}
.fbar-tag{font-size:11.5px;background:var(--IN-BG);color:var(--IN);
  padding:3px 10px;border-radius:99px;border:1px solid var(--IN-BD);font-weight:600}

.flt-date-wrap{position:relative;display:inline-flex;align-items:center;gap:0}
.flt-date-wrap input[type=text]{border-radius:var(--R-sm) 0 0 var(--R-sm);
  border-right:none;width:114px}
.flt-date-wrap input[type=date]{width:30px;padding:0;border-left:none;
  border-radius:0 var(--R-sm) var(--R-sm) 0;background:var(--SF-2);
  color:transparent;cursor:pointer;min-width:0}
.flt-date-wrap input[type=date]::-webkit-calendar-picker-indicator{
  width:22px;height:22px;cursor:pointer;opacity:.55;margin:0 3px}
.flt-date-wrap input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1}

.sei-wrap{position:relative}
.sei-drop{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--SF);
  border:1.5px solid var(--P);border-radius:var(--R-sm);
  max-height:220px;overflow-y:auto;z-index:500;display:none;box-shadow:var(--SH3)}
.sei-drop.open{display:block}
.sei-opt{padding:8px 13px;font-size:12.5px;cursor:pointer;color:var(--TX);
  border-bottom:1px solid var(--BD-2);line-height:1.4}
.sei-opt:last-child{border-bottom:none}
.sei-opt:hover{background:var(--P-soft);color:var(--P)}
.sei-opt mark{background:rgba(196,149,42,.2);color:var(--P);font-weight:700;padding:0 2px;border-radius:2px}

.refresh-btn{display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--BD);
  background:var(--SF);color:var(--TM);cursor:pointer;flex-shrink:0;
  transition:all var(--T)}
.refresh-btn:hover{background:var(--P);border-color:var(--P);color:#fff}
.refresh-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.content{flex:1;overflow-y:auto;padding:26px}

/* CARDS */
.sc{background:var(--SF);border-radius:var(--R);box-shadow:var(--SH1);
  border:1px solid var(--BD);overflow:hidden;margin-bottom:16px}
.sc-hd{padding:16px 20px;border-bottom:1px solid var(--BD-2);
  display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.sc-title{font-size:14px;font-weight:600;flex:1;color:var(--TX)}
.sc-bd{padding:20px}

.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stc{background:var(--SF);border-radius:var(--R);padding:20px;box-shadow:var(--SH1);
  border:1px solid var(--BD);display:flex;align-items:center;gap:14px;
  transition:all var(--T);position:relative;overflow:hidden}
.stc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--stc-c,var(--P))}
.stc:hover{transform:translateY(-2px);box-shadow:var(--SH2);border-color:var(--stc-c,var(--P))}
.sti{width:42px;height:42px;border-radius:var(--R-md);flex-shrink:0;
  background:var(--stc-bg,var(--P-soft));color:var(--stc-c,var(--P));
  display:flex;align-items:center;justify-content:center}
.sti svg{width:22px;height:22px}
.stv{font-size:30px;font-weight:700;font-family:'Fraunces',serif;line-height:1;
  color:var(--stc-c,var(--TX));letter-spacing:-.02em}
.stl{font-size:11.5px;color:var(--TM);margin-top:5px;font-weight:500;
  letter-spacing:.02em;text-transform:uppercase}

.cg2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.cg2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.ch-wrap{position:relative;height:220px}
.ch-wrap.sm{height:185px}

/* DASH TABS */
.dtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1.5px solid var(--BD)}
.dtab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--TM);position:relative;
  transition:all var(--T);white-space:nowrap;border:none;background:transparent;cursor:pointer;
  border-radius:var(--R-sm) var(--R-sm) 0 0}
.dtab:hover{color:var(--P);background:var(--P-soft)}
.dtab.act{color:var(--P)}
.dtab.act::after{content:"";position:absolute;left:10px;right:10px;bottom:-1.5px;height:3px;
  background:linear-gradient(90deg,var(--P),var(--P-3));border-radius:3px 3px 0 0}

/* TOOLTIPS EXPLICATIVOS */
.tip-i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
  border-radius:50%;border:1px solid var(--BD);color:var(--TM-2);font-size:9px;font-weight:700;
  font-style:normal;font-family:'Fraunces',serif;margin-left:6px;cursor:help;line-height:1;
  vertical-align:middle;transition:all var(--T);flex-shrink:0;background:var(--SF)}
.tip-i:hover{border-color:var(--P);color:var(--P);background:var(--P-soft)}
.stc.has-tip{cursor:help}
.htip{position:fixed;z-index:10000;max-width:330px;background:#0F1E3D;color:#E7ECF6;
  font-size:12px;line-height:1.6;padding:13px 15px;border-radius:11px;
  box-shadow:0 14px 36px rgba(6,20,58,.40);white-space:pre-line;pointer-events:none;
  opacity:0;transform:translateY(4px);transition:opacity .16s var(--E),transform .16s var(--E);
  display:none;font-family:'Inter',sans-serif;letter-spacing:.005em;border:1px solid rgba(196,149,42,.25)}
.htip.show{opacity:1;transform:translateY(0)}

/* PROGRESS */
.pb{height:6px;background:var(--BD-2);border-radius:6px;overflow:hidden}
.pf{height:100%;border-radius:6px;transition:width .5s var(--E)}
.pf.done{background:linear-gradient(90deg,var(--OK),#22A05B)}
.pf.going{background:linear-gradient(90deg,var(--G),var(--G-2))}
.pf.pend{background:#B4BDD0}
.pf.cancel{background:var(--CA)}

/* STATUS */
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.sd-ok{background:var(--OK)}.sd-wn{background:var(--G)}.sd-pn{background:#9CA3AF}.sd-er{background:var(--ER)}.sd-ca{background:var(--CA)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:99px;font-size:11.5px;font-weight:600}
.b-ok{background:var(--OK-BG);color:var(--OK);border:1px solid var(--OK-BD)}
.b-wn{background:var(--WN-BG);color:var(--WN);border:1px solid var(--WN-BD)}
.b-er{background:var(--ER-BG);color:var(--ER);border:1px solid var(--ER-BD)}
.b-in{background:var(--IN-BG);color:var(--IN);border:1px solid var(--IN-BD)}
.b-pn{background:var(--PN-BG);color:var(--PN);border:1px solid var(--PN-BD)}
.b-ca{background:var(--CA-BG);color:var(--CA);border:1px solid var(--CA-BD)}
.b-gd{background:var(--G-soft);color:var(--G);border:1px solid var(--G-2)}
.b-nm{background:var(--SF-2);color:var(--TM);border:1px solid var(--BD)}
.pri-a{color:var(--ER);font-weight:700;font-size:12px}
.pri-m{color:var(--WN);font-weight:700;font-size:12px}
.pri-b{color:var(--OK);font-weight:700;font-size:12px}

/* TABLE */
.at{width:100%;border-collapse:collapse}
.at th{text-align:left;padding:11px 16px;font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;color:var(--TM);
  border-bottom:1px solid var(--BD);white-space:nowrap;background:var(--SF-2)}
.at td{padding:13px 16px;border-bottom:1px solid var(--BD-2);vertical-align:middle}
.at tr:last-child td{border-bottom:none}
.at tr{transition:background var(--T)}
.at tr:hover td{background:var(--P-glass)}
.at-title{font-weight:600;color:var(--TX);font-size:13px}
.at-sub{font-size:11px;color:var(--TM);margin-top:2px;line-height:1.45}
.at-act{display:flex;gap:4px;flex-wrap:nowrap}

/* NODE HEADER */
.nh{background:var(--SF);border-radius:var(--R);padding:22px 24px;
  border:1px solid var(--BD);box-shadow:var(--SH1);margin-bottom:18px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;overflow:hidden}
.nh::before{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--P),var(--P-3))}
.nh h2{font-size:19px;color:var(--P);font-weight:600;padding-left:8px}
.nstats{display:flex;gap:26px;margin-left:auto}
.nstat{text-align:center}
.nstat-v{font-size:22px;font-weight:700;font-family:'Fraunces',serif;letter-spacing:-.02em}
.nstat-l{font-size:10.5px;color:var(--TM);font-weight:500;
  letter-spacing:.06em;text-transform:uppercase;margin-top:3px}

.sng{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px;margin-bottom:18px}
.snc{background:var(--SF);border-radius:var(--R-md);padding:15px;border:1px solid var(--BD);
  box-shadow:var(--SH1);cursor:pointer;transition:all var(--T);position:relative;overflow:hidden}
.snc::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--P-3);transform:scaleX(0);transform-origin:left;transition:transform var(--T)}
.snc:hover{border-color:var(--P);transform:translateY(-2px);box-shadow:var(--SH2)}
.snc:hover::before{transform:scaleX(1)}
.snc-t{font-weight:600;font-size:13.5px;color:var(--TX);margin-bottom:4px}
.snc-c{font-size:11.5px;color:var(--TM)}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(6px)}
.mo.open{display:flex;animation:fi .2s var(--E)}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mbox{background:var(--SF);border-radius:18px;width:620px;max-width:100%;
  box-shadow:0 28px 80px rgba(15,23,42,.28);max-height:90vh;overflow:hidden;
  display:flex;flex-direction:column;animation:su .25s var(--E)}
@keyframes su{from{transform:translateY(20px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.mhd{padding:20px 24px 16px;border-bottom:1px solid var(--BD-2);display:flex;align-items:center;gap:11px}
.mtitle{font-size:17px;color:var(--P);flex:1;font-family:'Fraunces',serif;font-weight:600}
.mbd{padding:20px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:15px}
.mft{padding:14px 24px;border-top:1px solid var(--BD-2);display:flex;align-items:center;gap:8px;
  justify-content:flex-end;background:var(--SF-2)}

/* FORM */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:11px;font-weight:600;color:var(--TM);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{padding:10px 13px;border:1.5px solid var(--BD);
  border-radius:var(--R-md);font-size:13.5px;color:var(--TX);background:var(--SF-2);
  outline:none;transition:all var(--T);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--P);background:var(--SF);box-shadow:var(--ring)}
.fld textarea{resize:vertical;min-height:80px;line-height:1.55}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diw{position:relative}
.diw input{padding-right:64px}
.btn-today{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  font-size:11px;font-weight:600;padding:4px 10px;
  background:var(--P);color:#fff;border-radius:var(--R-xs);cursor:pointer;border:none}
.btn-today:hover{background:var(--P-2)}
.pr-wrap{display:flex;align-items:center;gap:12px}
.pr-wrap input[type=range]{flex:1;-webkit-appearance:none;height:6px;
  background:var(--BD);border-radius:6px;outline:none;border:none;padding:0;cursor:pointer}
.pr-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--P);cursor:pointer;border:3px solid #fff;
  box-shadow:0 2px 6px rgba(10,37,88,.3)}
.pr-pct{min-width:42px;text-align:right;font-weight:700;color:var(--P);font-size:14px;font-family:'Fraunces',serif}

.resp-wrap{flex:1;border:1.5px solid var(--BD);border-radius:var(--R-md);
  background:var(--SF-2);min-height:42px;padding:6px 9px;
  display:flex;flex-wrap:wrap;gap:5px;cursor:text;align-items:center}
.resp-wrap:focus-within{border-color:var(--P);background:var(--SF);box-shadow:var(--ring)}
.resp-tag{display:inline-flex;align-items:center;gap:5px;background:var(--IN-BG);
  color:var(--IN);border:1px solid var(--IN-BD);border-radius:99px;
  padding:3px 9px;font-size:12px;font-weight:500}
.resp-tag span{cursor:pointer;opacity:.55;font-size:10px}
.resp-tag span:hover{opacity:1}

/* TIMELINE CHIP */
.tc{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:500;background:var(--SF-2);border:1px solid var(--BD);color:var(--TM)}
.tc.ov{background:var(--ER-BG);border-color:var(--ER-BD);color:var(--ER);font-weight:600}
.tc.up{background:var(--IN-BG);border-color:var(--IN-BD);color:var(--IN)}
.tc.td{background:var(--WN-BG);border-color:var(--WN-BD);color:var(--WN);font-weight:600}

/* TOAST */
#tst{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:13px 20px;border-radius:var(--R-md);font-size:13px;font-weight:500;
  box-shadow:var(--SH3);min-width:240px;animation:tin .3s var(--E)}
@keyframes tin{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.ok{background:var(--OK);color:#fff}
.toast.er{background:var(--ER);color:#fff}
.toast.in{background:var(--P);color:#fff}

/* CONFIRM */
#co{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:2000;
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#co.open{display:flex;animation:fi .2s var(--E)}
.cbox{background:var(--SF);border-radius:18px;padding:28px;max-width:380px;width:100%;
  box-shadow:var(--SH3);text-align:center}
.cicon{width:54px;height:54px;border-radius:50%;background:var(--ER-BG);
  color:var(--ER);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;font-family:'Fraunces',serif}
.ctitle{font-size:17px;color:var(--TX);font-family:'Fraunces',serif;margin-bottom:7px;font-weight:600}
.cmsg{font-size:13.5px;color:var(--TM);margin-bottom:20px;line-height:1.55}
.cact{display:flex;gap:9px;justify-content:center}

/* EMPTY */
.empty{text-align:center;padding:54px 22px;color:var(--TM)}
.empty .ei{font-size:42px;margin-bottom:11px;color:var(--BD);font-family:'Fraunces',serif;line-height:1}
.empty h3{font-size:16px;color:var(--TX);margin-bottom:5px;font-weight:600}
.empty p{font-size:13px}

/* PLANNER */
.planner-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden;margin:-26px}
.planner-topbar{padding:18px 26px;background:var(--SF);border-bottom:1px solid var(--BD);
  display:flex;align-items:center;gap:16px;flex-shrink:0;flex-wrap:wrap}
.planner-topbar h2{font-size:19px;color:var(--P);font-family:'Fraunces',serif;font-weight:600}
.planner-board{display:flex;overflow-x:auto;flex:1;background:var(--BG);padding:20px;
  gap:14px;align-items:flex-start}
.planner-board::-webkit-scrollbar{height:10px}
.planner-board::-webkit-scrollbar-thumb{background:var(--BD)}

.bcol{min-width:280px;max-width:280px;background:var(--SF);border-radius:var(--R);
  border:1px solid var(--BD);box-shadow:var(--SH1);display:flex;
  flex-direction:column;flex-shrink:0;max-height:calc(100vh - 170px);overflow:hidden}
.bcol-hd{padding:13px 16px;background:linear-gradient(135deg,var(--P),var(--P-2));
  border-radius:var(--R) var(--R) 0 0;color:#fff;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  display:flex;align-items:center;gap:9px;flex-shrink:0}
.bcol-hd-cnt{margin-left:auto;background:rgba(255,255,255,.22);
  padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.bcol-body{flex:1;overflow-y:auto;padding:12px}

.bgrp{margin-bottom:14px}
.bgrp-hd{font-size:10.5px;font-weight:700;color:var(--TM);text-transform:uppercase;
  letter-spacing:.07em;padding:6px 3px;margin-bottom:7px;
  display:flex;align-items:center;gap:7px;cursor:pointer;
  border-bottom:1px solid var(--BD-2)}
.bgrp-hd:hover{color:var(--P)}
.bgrp-hd .bgrp-cnt{margin-left:auto;font-size:10px;color:var(--TM-2);font-weight:500;letter-spacing:0;text-transform:none}
.bgrp-toggle{font-size:9px;color:var(--TM-2);transition:transform var(--T)}
.bgrp.collapsed .bgrp-items{display:none}
.bgrp.collapsed .bgrp-toggle{transform:rotate(-90deg)}

.acard{background:var(--SF);border:1px solid var(--BD);border-radius:var(--R-md);
  padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:all var(--T);
  border-left:3px solid var(--BD)}
.acard:hover{box-shadow:var(--SH2);border-color:var(--P-3);transform:translateY(-1px)}
.acard.done{border-left-color:var(--OK)}
.acard.going{border-left-color:var(--G)}
.acard.pend{border-left-color:#9CA3AF}
.acard.cancel{border-left-color:var(--CA)}
.ac-t{font-size:13px;font-weight:600;color:var(--TX);line-height:1.4;margin-bottom:8px}
.ac-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ac-pct{font-size:10.5px;color:var(--TM);text-align:right;margin-bottom:3px;font-weight:500}
.ac-date{font-size:10.5px;color:var(--TM);margin-top:5px}
.ac-date.ov{color:var(--ER);font-weight:600}
.ac-resp{font-size:10.5px;color:var(--TM);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-card-btn{width:100%;padding:9px 12px;font-size:12px;color:var(--TM);
  border:1.5px dashed var(--BD);border-radius:var(--R-md);background:transparent;
  cursor:pointer;transition:all var(--T);text-align:left;margin-top:5px}
.add-card-btn:hover{border-color:var(--P);color:var(--P);background:var(--P-soft)}

.sum-ln{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px dashed var(--BD-2)}
.sum-ln:last-child{border-bottom:none}
.sum-ln span{font-size:13px;color:var(--TX-2)}
.sum-ln b{font-size:15px;font-family:'Fraunces',serif}
.lsec{font-size:11px;font-weight:700;color:var(--TM);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:8px}
.hint{font-size:12px;color:var(--TM);line-height:1.55}

.pg{animation:pg .25s var(--E)}
@keyframes pg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:900px){
  .sb{display:none}
  .dg{grid-template-columns:1fr 1fr}
  .cg2,.cg2b{grid-template-columns:1fr}
}
@media(max-width:560px){
  .dg{grid-template-columns:1fr}
  .fr{grid-template-columns:1fr}
  .mbox{width:100%;border-radius:18px 18px 0 0;align-self:flex-end}
}
/* ════════ CAMADA DE ELEGÂNCIA — aditiva, não remove nada acima ════════ */
@media (prefers-reduced-motion: no-preference){
  .pg{animation:fadeUp .32s var(--E) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .stc{animation:popIn .34s var(--E) both}
  @keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .dg .stc:nth-child(2){animation-delay:.04s}
  .dg .stc:nth-child(3){animation-delay:.08s}
  .dg .stc:nth-child(4){animation-delay:.12s}
  .dg .stc:nth-child(5){animation-delay:.16s}
  .mo.open .mbox{animation:modalIn .3s var(--E)}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
}
/* vidro sutil na topbar e na barra de filtros */
.topbar{backdrop-filter:saturate(1.4) blur(8px);background:rgba(255,255,255,.82)}
.fbar{backdrop-filter:saturate(1.3) blur(6px)}
/* brilho discreto ao passar o mouse no botão primário */
.btn-P{position:relative;overflow:hidden}
.btn-P::after{content:"";position:absolute;top:0;left:-130%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-18deg);transition:left .6s var(--E);pointer-events:none}
.btn-P:hover::after{left:140%}
/* foco acessível e moderno */
:focus-visible{outline:none;box-shadow:var(--ring)}
/* halo no hover dos KPIs (usa a própria cor do card) */
.stc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:0;transition:opacity .25s var(--E)}
.stc:hover::after{opacity:.10;box-shadow:0 0 26px 2px var(--stc-c,var(--P)) inset}
/* item ativo da sidebar com contorno tênue */
.ni.act{box-shadow:inset 0 0 0 1px rgba(196,149,42,.18)}
/* preenchimento de progresso mais suave */
.pf{transition:width .5s var(--E)}
/* breadcrumb clicável (usado na Edição 3) */
.bc-link{cursor:pointer;color:var(--TM);transition:color .15s var(--E);border-bottom:1px solid transparent}
.bc-link:hover{color:var(--P);border-bottom-color:var(--P-3)}
/* Paleta de Comando (Ctrl/Cmd + K) */
#cmdk{position:fixed;inset:0;z-index:10000;display:none;align-items:flex-start;
  justify-content:center;background:rgba(6,20,58,.45);backdrop-filter:blur(6px);padding-top:12vh}
#cmdk.open{display:flex;animation:fadeUp .18s var(--E)}
.cmdk-box{width:560px;max-width:92vw;background:var(--SF);border-radius:16px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.4);border:1px solid var(--BD)}
.cmdk-in{width:100%;padding:16px 18px;font-size:15px;border:none;outline:none;
  border-bottom:1px solid var(--BD);background:var(--SF);color:var(--TX)}
.cmdk-list{max-height:50vh;overflow-y:auto;padding:6px}
.cmdk-it{padding:10px 13px;border-radius:var(--R-sm);cursor:pointer;display:flex;gap:10px;
  align-items:center;font-size:13.5px;color:var(--TX-2)}
.cmdk-it small{color:var(--TM-2);font-size:11px;margin-left:auto}
.cmdk-it.sel,.cmdk-it:hover{background:var(--P-soft);color:var(--P)}
.cmdk-hint{padding:8px 14px;font-size:11px;color:var(--TM-2);border-top:1px solid var(--BD-2);
  display:flex;gap:14px;flex-wrap:wrap}
</style>
</head>

async function sbCall(rpc, params={}){
  const url = SUPABASE_URL + '/rest/v1/rpc/' + rpc;
  const res = await fetch(url, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey':SUPABASE_ANON_KEY,
      'Authorization':'Bearer '+SUPABASE_ANON_KEY
    },
    body: JSON.stringify(params)
  });
  if(!res.ok){
    let err = 'HTTP '+res.status;
    try{ const j = await res.json(); err = j.message || j.hint || err; }catch{}
    throw new Error(err);
  }
  return res.json();
}

// TREE UTILS
// ═══════════════════════════════════════════
function findN(id,n){
  if(n.id===id)return n;
  if(n.children){for(const c of n.children){const f=findN(id,c);if(f)return f;}}
  return null;
}
function nodePath(id){
  function s(n,p){
    const c=[...p,n.label];if(n.id===id)return c;
    if(n.children){for(const x of n.children){const r=s(x,c);if(r)return r;}}
    return null;
  }
  return s(TREE,[])||[id];
}
function descIds(n){
  const ids=[n.id];
  if(n.children)n.children.forEach(c=>ids.push(...descIds(c)));
  return ids;
}
function allNodes(){
  const out=[];
  function w(n){if(n.id!=='root')out.push(n);if(n.children)n.children.forEach(w);}
  TREE.children.forEach(w);return out;
}
function isLeaf(n){return n&&(n.leaf||!n.children);}
function cntNode(nid){
  const nd=findN(nid,TREE);if(!nd)return 0;
  return filterAcoes(DB.acoes).filter(a=>descIds(nd).includes(a.nodeId)).length;
}
function ancestorIds(targetId,n,path=[]){
  if(n.id===targetId)return path;
  if(n.children){for(const c of n.children){const r=ancestorIds(targetId,c,[...path,n.id]);if(r)return r;}}
  return null;
}

    nav.appendChild(d);return d;
  }

  addNI('Dashboard','lv1 clickable',()=>sv('dash'),'dash',I.dash);
  addNI('Minhas Ações','lv1 clickable',()=>sv('minhas'),'minhas',I.my);
  addNI('Arquivadas','lv1 clickable',()=>sv('arq'),'arq',I.arc);
  if(CU.role==='admin') addNI('Administração','lv1 clickable',()=>sv('admin'),'admin',I.adm);

  const sp=document.createElement('div');sp.className='sep-sb';nav.appendChild(sp);

  TREE.children.forEach(section=>{
    const d=document.createElement('div');
    d.className='ni lv1-sec clickable'+(CID==='planner_'+section.id?' act':'');
    d.innerHTML='<span style="flex:1">'+section.label+'</span>'+
      '<span class="sec-hint">Painel ›</span>';
    d.onclick=()=>sv('planner',section.id);
    nav.appendChild(d);
    renderNC(nav,section.children,2);
  });
}

function renderNC(parent,children,lv){
  if(!children)return;
  children.forEach(n=>{
    const cnt=cntNode(n.id);
    const isOpen=openNodes.has(n.id);
    const d=document.createElement('div');
    d.className='ni lv'+lv+' clickable'+(CID===n.id?' act':'')+(isOpen?' open':'');
    let inner='<span style="flex:1">'+n.label+'</span>';
    if(cnt>0)inner+='<span class="nb">'+cnt+'</span>';
    if(n.children)inner+='<span class="ni-arr">&#9654;</span>';
    d.innerHTML=inner;
    parent.appendChild(d);
    if(n.children){
      const wrap=document.createElement('div');
      wrap.className='nc'+(isOpen?' open':'');
      d.onclick=e=>{
        e.stopPropagation();
        const opening=!d.classList.contains('open');
        d.classList.toggle('open');
        wrap.classList.toggle('open');
        if(opening)openNodes.add(n.id);
        else openNodes.delete(n.id);
      };
      renderNC(wrap,n.children,lv+1);
      parent.appendChild(wrap);
    }else{d.onclick=()=>sv('node',n.id);}
  });
}

function sv(view,nid){
  CID=(view==='planner'?'planner_'+nid:nid||view);
  buildSB();
  const mc=g('mc'),ta=g('ta'),bc=g('bc');
  mc.className='content pg';
  if(view==='dash'){
    bc.innerHTML='<span class="cur">Dashboard</span>';
    ta.innerHTML='<button class="btn btn-P btn-sm" onclick="openAM()">+ Nova Ação</button>';
    renderDash(mc);
  }else if(view==='planner'){
    const sec=findN(nid,TREE);
    bc.innerHTML='<span>Painel</span><span class="sep">›</span><span class="cur">'+(sec?sec.label:nid)+'</span>';
    ta.innerHTML='<button class="btn btn-P btn-sm" onclick="openAM()">+ Nova Ação</button>';
    renderPlanner(mc,sec);
  }else if(view==='node'){
    const node=findN(nid,TREE);if(!node)return;
    const path=nodePath(nid);
    const aids=ancestorIds(nid,TREE)||[];        // [root, ...ancestrais] (alinha com path[0..n-1])
    const secIds=TREE.children.map(s=>s.id);      // ids das seções (Nacional/Internacional)
    bc.innerHTML=path.map((p,i)=>{
      if(i===path.length-1) return '<span class="cur">'+p+'</span>';
      const aid=aids[i];
      let onclick="sv('dash')";
      if(aid&&aid!=='root') onclick=secIds.includes(aid)?"sv('planner','"+aid+"')":"sv('node','"+aid+"')";
      return '<span class="bc-link" onclick="'+onclick+'">'+p+'</span><span class="sep">›</span>';
    }).join('');
    const canA=CU.role==='admin'||isLeaf(node);
    ta.innerHTML=canA?'<button class="btn btn-P btn-sm" onclick="openAM(\''+nid+'\')">+ Nova Ação</button>':'';
    renderNode(mc,node,nid);
  }else if(view==='minhas'){
    bc.innerHTML='<span class="cur">Minhas Ações</span>';
    ta.innerHTML='<button class="btn btn-P btn-sm" onclick="openAM()">+ Nova Ação</button>';
    renderMinhas(mc);
  }else if(view==='arq'){
    bc.innerHTML='<span class="cur">Ações Arquivadas</span>';
    ta.innerHTML='';renderArq(mc);
  }else if(view==='admin'){
    bc.innerHTML='<span class="cur">Administração</span>';
    ta.innerHTML='<button class="btn btn-P btn-sm" onclick="openUM()">+ Novo Usuário</button>';
    renderAdmin(mc);
  }else if(view==='profile'){
    bc.innerHTML='<span class="cur">Meu Perfil</span>';
    ta.innerHTML='';renderProfile(mc);
  }
}

function _dashList(){return [

];}
function _dashCtx(){
  const ac=filterAcoes(DB.acoes),arqL=filterAcoes(DB.arquivadas||[]);
  const tot=ac.length,done=ac.filter(a=>a.status==='concluido').length;
  const going=ac.filter(a=>a.status==='em andamento').length;
  const pend=ac.filter(a=>a.status==='pendente').length;
  const canc=ac.filter(a=>a.status==='cancelada').length;
  const today=new Date();today.setHours(0,0,0,0);
  const venc=ac.filter(a=>{if(!a.dataFim||a.status==='concluido'||a.status==='cancelada')return false;
    const d=parseBR(a.dataFim);return d&&d<today;}).length;
  const abertas=pend+going;
  return {ac,arqL,tot,done,going,pend,canc,venc,abertas};
}

        sl('Em Andamento',X.going,'var(--WN)')+

        sl('Canceladas',X.canc,'var(--CA)')+
        sl('Arquivadas',X.arqL.length,'#8B949E')+
      '</div></div>';

function sc(col,bg,val,lbl,ico,tip){
  return '<div class="stc'+(tip?' has-tip':'')+'" style="--stc-c:'+col+';--stc-bg:'+bg+'"'+(tip?' '+tipAttr(tip):'')+'>'+
    '<div class="sti">'+(ico||'')+'</div>'+

}
function tipAttr(t){return 'data-tip="'+String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;')+'"';}
function tipI(t){return '<span class="tip-i" '+tipAttr(t)+'>i</span>';}
function scT(title,tip){return '<span class="sc-title"'+(tip?' '+tipAttr(tip)+' style="cursor:help"':'')+'>'+title+(tip?' <span class="tip-i">i</span>':'')+'</span>';}
(function(){
  if(window.__htipReady)return;window.__htipReady=true;
  const box=document.createElement('div');box.className='htip';document.body.appendChild(box);
  let cur=null,t0=null;
  function place(el){
    box.style.display='block';box.textContent=el.getAttribute('data-tip')||'';
    const r=el.getBoundingClientRect(),bw=box.offsetWidth,bh=box.offsetHeight;
    let left=r.left+r.width/2-bw/2;left=Math.max(10,Math.min(left,window.innerWidth-bw-10));
    let top=r.top-bh-10;if(top<10)top=r.bottom+10;
    box.style.left=left+'px';box.style.top=top+'px';box.classList.add('show');
  }
  function hide(){box.classList.remove('show');clearTimeout(t0);t0=setTimeout(()=>{if(!box.classList.contains('show'))box.style.display='none';},170);}
  document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el&&el!==cur){cur=el;place(el);}});
  document.addEventListener('mouseout',e=>{const el=e.target.closest('[data-tip]');if(el&&el===cur){cur=null;hide();}});
  document.addEventListener('click',()=>{if(cur){cur=null;hide();}});
})();
// ── Geradores de texto dos tooltips (reutilizam dados já carregados) ──
function _pct(n,d){return d?Math.round(n/d*100):0;}
function _mesLabel(ym){const M=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];const p=ym.split('-');return M[+p[1]-1]+'/'+p[0];}
function _peakMes(ac){const mm=_mmPorMes(ac),ks=Object.keys(mm).sort();let b=null,bn=0;
  ks.forEach(m=>{const t=mm[m].concluido+mm[m].andamento+mm[m].pendente+mm[m].cancelada;if(t>=bn){bn=t;b=m;}});
  return {month:b,n:bn,count:ks.length,first:ks.length?_mesLabel(ks[0]):'—',last:ks.length?_mesLabel(ks[ks.length-1]):'—'};}
function _topArea(ac){const a=[...TREE.children[0].children,...TREE.children[1].children];let b='—',bn=-1;
  a.forEach(x=>{const ids=descIds(x);const n=ac.filter(z=>ids.includes(z.nodeId)).length;if(n>bn){bn=n;b=x.label;}});return {label:b,n:bn};}
// Dashboard - KPIs Visão Geral
function _tGAtivas(X){return 'Ações Ativas\n\nO que mostra: ações em aberto, que ainda demandam trabalho.\nDefinição: pendentes + em andamento. Não inclui concluídas, canceladas nem arquivadas.\nServe para: enxergar a carga real de trabalho em curso.\nExemplo: há '+X.abertas+' ações em aberto ('+X.pend+' pendentes + '+X.going+' em andamento).';}
function _tGConcl(X){return 'Concluídas\n\nO que mostra: ações já finalizadas.\nCálculo: ações não arquivadas com status "concluído".\nServe para: medir entrega efetiva.\nExemplo: '+X.done+' de '+X.tot+' não arquivadas ('+_pct(X.done,X.tot)+'%) estão concluídas.';}
function _tGAnd(X){return 'Em Andamento\n\nO que mostra: ações em execução agora (parte das em aberto).\nCálculo: ações não arquivadas com status "em andamento".\nServe para: ver a carga de trabalho corrente.\nExemplo: '+X.going+' de '+X.abertas+' em aberto ('+_pct(X.going,X.abertas)+'%) em andamento.';}
function _tGVenc(X){return 'Vencidas\n\nO que mostra: ações não concluídas cujo prazo de conclusão já passou.\nCálculo: data de conclusão anterior a hoje, com status diferente de concluído/cancelada.\nServe para: alertar sobre atrasos que exigem ação.\nExemplo: '+X.venc+' ação(ões) vencida(s) neste momento.';}
function _tGCanc(X){return 'Canceladas\n\nO que mostra: ações não arquivadas que foram canceladas.\nCálculo: status "cancelada" entre as não arquivadas (não contam como em aberto).\nServe para: acompanhar descontinuidades.\nExemplo: '+X.canc+' ação(ões) cancelada(s).';}
function _tipResumo(X){return 'Resumo Consolidado\n\nO que mostra: os números-chave do setor em uma lista.\nCálculo: "Ativas (em aberto)" = pendentes + em andamento; o "Total" inclui também as arquivadas.\nServe para: leitura rápida do panorama.\nExemplo: '+X.abertas+' em aberto, '+X.done+' concluídas, '+X.canc+' canceladas e '+X.arqL.length+' arquivadas.';}
// Dashboard - gráficos
function _tipChSec(X){const t=_topArea(X.ac);return 'Ações por Área Principal\n\nO que mostra: distribuição das ações não arquivadas entre as grandes áreas (Nacional e Internacional) e suas frentes.\nEixo X: as frentes do setor.\nEixo Y: número de ações, escala de 0 até a maior frente.\nInterpretação: indica onde o esforço institucional está concentrado.\nLeitura: a frente com mais ações é '+t.label+', com '+t.n+' ações.';}
function _tipChSta(X){return 'Distribuição de Status\n\nO que mostra: a proporção das ações ativas por situação.\nCálculo: contagem por status sobre o total de '+X.tot+' ações não arquivadas; cada fatia é proporcional à quantidade.\nInterpretação: equilíbrio entre pendente, em andamento, concluído e cancelada.\nLeitura: '+X.done+' concluídas, '+X.going+' em andamento, '+X.pend+' pendentes e '+X.canc+' canceladas.';}
function _tipChBar(ac){const p=_peakMes(ac);return 'Ações por Mês\n\nO que mostra: quantas ações foram abertas em cada mês, empilhadas por status.\nEixo X: meses, em escala temporal adaptável (de '+p.first+' a '+p.last+', '+p.count+' meses com registro).\nEixo Y: número de ações, escala de 0 até o maior mês.\nInterpretação: revela picos de abertura, sazonalidade e ritmo de trabalho.\nLeitura: o mês de maior movimento foi '+(p.month?_mesLabel(p.month):'—')+', com '+p.n+' ações abertas.';}
function _tipChCum(ac){const d=ac.filter(a=>a.status==='concluido').length;return 'Acumulado no Período\n\nO que mostra: a soma acumulada de ações por status, mês a mês.\nEixo X: meses (mesma escala temporal do gráfico de barras).\nEixo Y: total acumulado, escala de 0 ao total do período.\nInterpretação: mostra a trajetória de crescimento do portfólio e o ritmo de conclusão.\nLeitura: ao fim do período o acumulado de concluídas chega a '+d+' ações.';}
function _tipTabela(ac){return 'Todas as Ações\n\nO que mostra: a lista de todas as ações não arquivadas (em aberto, concluídas e canceladas), uma por linha.\nDica: clique no nome de uma coluna para ordenar; clique de novo para inverter (crescente/decrescente).\nServe para: localizar e priorizar ações individualmente.\nExemplo: a tabela lista '+ac.length+' ações.';}
// Painel Estratégico - KPIs
function _tCplx(v){return 'Complexidade (0–100)\n\nO que mede: o grau de articulação média das ações.\nCálculo: índice 0–100 a partir de nº de responsáveis (30%), duração planejada (30%), existência de processo SEI (20%) e profundidade da seção na árvore (20%).\nServe para: comparar esforço estrutural, não apenas quantidade.\nExemplo: a complexidade média do portfólio é '+v+'/100.';}
function _tMat(v){return 'Maturação mediana\n\nO que mede: o tempo típico de vida de uma ação.\nCálculo: mediana, em dias, entre a criação e a conclusão (ou até hoje, se ainda aberta).\nServe para: entender quanto um acordo leva a amadurecer — o caso "30 dias x 18 meses".\nExemplo: metade das ações leva até '+v+' dias.';}
function _tImp(imp,av,total){return 'Impacto médio (1–5)\n\nO que mede: o impacto institucional percebido, avaliado manualmente em cada ação.\nCálculo: média das notas de 1 a 5 atribuídas às ações já avaliadas.\nServe para: separar volume de relevância estratégica.\nExemplo: média '+(imp?imp.toFixed(1):'—')+' sobre '+av+' de '+total+' ações avaliadas.';}
function _tEsf(v){return 'Esforço (resp./ação)\n\nO que mede: a carga operacional média.\nCálculo: média do número de responsáveis por ação.\nServe para: dimensionar a mão de obra envolvida.\nExemplo: em média '+v.toFixed(1)+' responsáveis por ação.';}
function _tEfet(efet,total){return 'Efetividade\n\nO que mede: a taxa de entrega do portfólio.\nCálculo: ações concluídas dividido pelo total de ações não arquivadas, em %.\nServe para: avaliar quanto do portfólio chega ao fim.\nExemplo: '+efet+'% das '+total+' ações do portfólio estão concluídas.';}
// Painel Estratégico - gráficos
function _tRadar(cplx,matN,impN,esfN,efetN){return 'Perfil do Portfólio\n\nO que mostra: as 5 dimensões estratégicas em um só desenho, cada eixo normalizado de 0 a 100.\nEixos: Complexidade, Maturação, Impacto, Esforço e Efetividade.\nInterpretação: dá a "forma" do portfólio — onde ele é forte e onde é frágil.\nLeitura: Complexidade '+cplx+', Maturação '+matN+', Impacto '+impN+', Esforço '+esfN+', Efetividade '+efetN+' (todos de 0 a 100).';}
function _tMatur(lbl,nn){return 'Maturação por Faixa de Tempo\n\nO que mostra: quantas ações se enquadram em cada faixa de duração.\nEixo X: faixas de tempo (0–30, 31–90, 91–180, 181–365 e +365 dias).\nEixo Y: número de ações, escala de 0 até a maior faixa.\nInterpretação: distingue o que resolve rápido do que exige maturação longa.\nLeitura: a faixa mais comum é '+lbl+', com '+nn+' ações.';}
function _tEfetArea(area,val){return 'Efetividade por Área\n\nO que mostra: a taxa de conclusão de cada frente do setor.\nEixo X: as frentes (Nacional e Internacional).\nEixo Y: % de conclusão, escala de 0 a 100%.\nInterpretação: aponta onde a entrega é mais alta e onde há gargalos.\nLeitura: a frente com maior efetividade é '+area+', com '+val+'% de conclusão.';}
// Node / seção
function _tNAcoes(tot){return 'Ações\n\nO que mostra: total de ações desta seção e de tudo abaixo dela na árvore.\nCálculo: contagem das ações não arquivadas em toda a subárvore.\nServe para: dimensionar o peso da seção.\nExemplo: esta seção tem '+tot+' ação(ões).';}
function _tNConcl(done,tot){return 'Concluídas\n\nO que mostra: ações já finalizadas nesta seção.\nCálculo: ações da subárvore com status "concluído".\nServe para: medir entrega local.\nExemplo: '+done+' de '+tot+' ('+_pct(done,tot)+'%) concluídas.';}
function _tNProg(avg){return 'Progresso\n\nO que mostra: o avanço médio das ações desta seção.\nCálculo: média do percentual de progresso das ações da subárvore.\nServe para: ver o quão adiantada está a seção como um todo.\nExemplo: progresso médio de '+avg+'%.';}
function _tNodeSta(arr){const d=arr.filter(a=>a.status==='concluido').length,g=arr.filter(a=>a.status==='em andamento').length;return 'Status (subárvore)\n\nO que mostra: a proporção por situação considerando toda a subárvore da seção.\nCálculo: contagem por status; cada fatia é proporcional.\nInterpretação: panorama de situação da seção.\nLeitura: '+d+' concluídas e '+g+' em andamento, de '+arr.length+' ações.';}
function _tNodePri(arr){const a=arr.filter(x=>x.prioridade==='alta').length;return 'Prioridades\n\nO que mostra: distribuição das ações da subárvore por prioridade.\nEixo X: Alta, Média, Baixa.\nEixo Y: número de ações.\nInterpretação: ajuda a focar onde há mais urgência.\nLeitura: '+a+' ação(ões) de prioridade alta.';}

function _tDSec(v){return 'Seções\n\nO que mostra: o número de seções finais (folhas) da árvore onde ações podem ser cadastradas.\nCálculo: contagem dos nós-folha da estrutura.\nExemplo: '+v+' seção(ões) finais.';}

function _mmPorMes(acoes){
  const mm={};
  acoes.forEach(a=>{
    const raw=a.criado||a.atualizado||'';
    if(!raw)return;
    const iso=new Date(raw);
    const d=isNaN(iso.getTime())?parseBR(raw):iso;
    if(!d)return;
    const ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!mm[ym])mm[ym]={concluido:0,andamento:0,pendente:0,cancelada:0};
    if(a.status==='concluido')mm[ym].concluido++;
    else if(a.status==='em andamento')mm[ym].andamento++;
    else if(a.status==='cancelada')mm[ym].cancelada++;
    else mm[ym].pendente++;
  });
  return mm;
}

// PAINEL ESTRATÉGICO (derivado de DB.acoes + impacto)
// ═══════════════════════════════════════════
function _nResp(a){return String(a.responsaveis||a.responsavel||'').split(',').map(s=>s.trim()).filter(Boolean).length;}
function _diasPlan(a){const i=parseBR(a.dataIni),f=parseBR(a.dataFim);if(!i||!f)return null;return Math.max(0,(f-i)/864e5);}
function _matur(a){
  const c=new Date(a.criado);if(isNaN(c))return null;
  let e=(a.status==='concluido')?new Date(a.atualizado):new Date();
  if(isNaN(e))e=new Date();
  return Math.max(0,(e-c)/864e5);
}
function _complex(a){
  const r=Math.min(_nResp(a),5)/5;
  const d=_diasPlan(a),dd=(d==null?0:Math.min(d,365)/365);
  const sei=(a.numeroSEI&&String(a.numeroSEI).trim())?1:0;
  const prof=Math.min(Math.max(nodePath(a.nodeId).length-1,0),6)/6;
  return r*0.30+dd*0.30+sei*0.20+prof*0.20; // 0..1
}
function _median(arr){
  const v=arr.filter(x=>x!=null).sort((a,b)=>a-b);if(!v.length)return 0;
  const m=Math.floor(v.length/2);return v.length%2?v[m]:(v[m-1]+v[m])/2;
}
function estrategicoHTML(ac){
  const n=ac.length||1;
  const cplx=Math.round(ac.reduce((s,a)=>s+_complex(a),0)/n*100);
  const matMed=Math.round(_median(ac.map(_matur)));
  const avaliadas=ac.filter(a=>a.impacto!=null);
  const imp=avaliadas.length?(avaliadas.reduce((s,a)=>s+Number(a.impacto),0)/avaliadas.length):0;
  const respMed=ac.reduce((s,a)=>s+_nResp(a),0)/n;
  const efet=Math.round(ac.filter(a=>a.status==='concluido').length/n*100);
  const _f=[0,0,0,0,0];ac.forEach(a=>{const dd=_matur(a);if(dd==null)return;if(dd<=30)_f[0]++;else if(dd<=90)_f[1]++;else if(dd<=180)_f[2]++;else if(dd<=365)_f[3]++;else _f[4]++;});
  const _fL=['0–30 dias','31–90 dias','91–180 dias','181–365 dias','mais de 365 dias'];let _fi=0;_f.forEach((v,i)=>{if(v>_f[_fi])_fi=i;});
  const _eAr=[...TREE.children[0].children,...TREE.children[1].children];let _eA='—',_eV=-1;
  _eAr.forEach(x=>{const ids=descIds(x);const sub=ac.filter(a=>ids.includes(a.nodeId));if(sub.length){const tx=Math.round(sub.filter(a=>a.status==='concluido').length/sub.length*100);if(tx>_eV){_eV=tx;_eA=x.label;}}});
  const _rC=Math.round(ac.reduce((s,a)=>s+_complex(a),0)/n*100),_rM=Math.round(Math.min(_median(ac.map(_matur))/365*100,100)),_rI=Math.round(imp/5*100),_rE=Math.round(Math.min(respMed/5*100,100)),_rF=efet;
  return ''+
  secHdr('Painel Estratégico · GRII','5 dimensões')+
  '<div class="dg" style="grid-template-columns:repeat(5,1fr)">'+
    sc('var(--P)','var(--P-soft)',cplx,'Complexidade (0–100)','',_tCplx(cplx))+
    sc('var(--IN)','var(--IN-BG)',matMed+'d','Maturação mediana','',_tMat(matMed))+
    sc('var(--G)','var(--G-soft)',(imp?imp.toFixed(1):'—'),'Impacto médio (1–5)','',_tImp(imp,avaliadas.length,n))+
    sc('var(--P-3)','var(--P-soft)',respMed.toFixed(1),'Esforço (resp./ação)','',_tEsf(respMed))+
    sc('var(--OK)','var(--OK-BG)',efet+'%','Efetividade','',_tEfet(efet,n))+
  '</div>'+
  '<div class="cg2" style="margin-top:14px">'+
    '<div class="sc"><div class="sc-hd">'+scT('Perfil do Portfólio',_tRadar(_rC,_rM,_rI,_rE,_rF))+'</div>'+
      '<div class="sc-bd"><div class="ch-wrap"><canvas id="chRadar"></canvas></div></div></div>'+
    '<div class="sc"><div class="sc-hd">'+scT('Maturação por Faixa de Tempo',_tMatur(_fL[_fi],_f[_fi]))+'</div>'+
      '<div class="sc-bd"><div class="ch-wrap"><canvas id="chMatur"></canvas></div></div></div>'+
  '</div>'+
  '<div class="sc" style="margin-top:14px;margin-bottom:14px"><div class="sc-hd">'+scT('Efetividade por Área',_tEfetArea(_eA,_eV<0?0:_eV))+'</div>'+
    '<div class="sc-bd"><div class="ch-wrap"><canvas id="chEfet"></canvas></div></div></div>';
}
function initEstrategico(ac){
  const n=ac.length||1;
  const ctxR=g('chRadar');
  if(ctxR){
    const cplx=ac.reduce((s,a)=>s+_complex(a),0)/n*100;
    const matMed=_median(ac.map(_matur));
    const av=ac.filter(a=>a.impacto!=null);
    const imp=av.length?(av.reduce((s,a)=>s+Number(a.impacto),0)/av.length):0;
    const respMed=ac.reduce((s,a)=>s+_nResp(a),0)/n;
    const efet=ac.filter(a=>a.status==='concluido').length/n*100;
    new Chart(ctxR,{type:'radar',data:{labels:['Complexidade','Maturação','Impacto','Esforço','Efetividade'],
      datasets:[{label:'Portfólio',
        data:[Math.round(cplx),Math.round(Math.min(matMed/365*100,100)),Math.round(imp/5*100),Math.round(Math.min(respMed/5*100,100)),Math.round(efet)],
        backgroundColor:'rgba(10,37,88,.14)',borderColor:'rgba(10,37,88,.85)',borderWidth:2,
        pointBackgroundColor:'#C4952A',pointRadius:3}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{r:{beginAtZero:true,max:100,ticks:{stepSize:20,font:{size:9},backdropColor:'transparent'},
          grid:{color:'#E6EAF2'},angleLines:{color:'#E6EAF2'},pointLabels:{font:{size:11}}}}}});
  }
  const ctxM=g('chMatur');
  if(ctxM){
    const f=[0,0,0,0,0],lbl=['0–30d','31–90d','91–180d','181–365d','+365d'];
    ac.forEach(a=>{const d=_matur(a);if(d==null)return;
      if(d<=30)f[0]++;else if(d<=90)f[1]++;else if(d<=180)f[2]++;else if(d<=365)f[3]++;else f[4]++;});
    new Chart(ctxM,{type:'bar',data:{labels:lbl,datasets:[{label:'Ações',data:f,
      backgroundColor:['rgba(21,128,61,.78)','rgba(29,78,216,.72)','rgba(196,149,42,.78)','rgba(161,98,7,.78)','rgba(185,28,28,.78)'],
      borderRadius:6,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{beginAtZero:true,ticks:{stepSize:1,font:{size:11}},grid:{color:'#F0F3F8',drawBorder:false}},
                x:{ticks:{font:{size:10}},grid:{display:false}}}}});
  }
  const ctxE=g('chEfet');
  if(ctxE){
    const nac=TREE.children[0].children,intl=TREE.children[1].children,areas=[...nac,...intl];
    const labels=areas.map(x=>x.label.length>16?x.label.slice(0,14)+'…':x.label);
    const taxa=areas.map(x=>{const ids=descIds(x);const sub=ac.filter(a=>ids.includes(a.nodeId));
      return sub.length?Math.round(sub.filter(a=>a.status==='concluido').length/sub.length*100):0;});
    new Chart(ctxE,{type:'bar',data:{labels,datasets:[{label:'% concluídas',data:taxa,
      backgroundColor:'rgba(21,128,61,.72)',borderRadius:6,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{beginAtZero:true,max:100,ticks:{stepSize:20,font:{size:11},callback:v=>v+'%'},grid:{color:'#F0F3F8',drawBorder:false}},
                x:{ticks:{font:{size:9}},grid:{display:false}}}}});
  }
}

function renderPlanner(c,sec){
  if(!sec||!sec.children){c.innerHTML='<div class="empty"><h3>Seção não encontrada</h3></div>';return;}
  const today=new Date();today.setHours(0,0,0,0);
  const _fa=filterAcoes(DB.acoes);
  const totSec=_fa.filter(a=>descIds(sec).includes(a.nodeId)).length;
  const doneSec=_fa.filter(a=>descIds(sec).includes(a.nodeId)&&a.status==='concluido').length;
  let statsHtml=
    '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;width:100%">'+
      '<h2>Painel — '+sec.label+'</h2>'+
      '<span class="badge b-nm">'+totSec+' ações</span>'+
      '<span class="badge b-ok">'+doneSec+' concluídas</span>'+
      '<button class="btn btn-P btn-sm" style="margin-left:auto" onclick="openAM()">+ Nova Ação</button>'+
    '</div>';
  let boardHtml='<div class="planner-board">';
  sec.children.forEach(col=>{
    const colIds=descIds(col);
    const colAcoes=_fa.filter(a=>colIds.includes(a.nodeId));
    boardHtml+='<div class="bcol"><div class="bcol-hd">'+col.label+
      '<span class="bcol-hd-cnt">'+colAcoes.length+'</span></div><div class="bcol-body">';
    if(isLeaf(col)){
      const leafAcs=_fa.filter(a=>a.nodeId===col.id);
      leafAcs.forEach(a=>{boardHtml+=cardHTML(a,today);});
      boardHtml+='<button class="add-card-btn" onclick="openAM(\''+col.id+'\')">+ Adicionar ação</button>';
    } else { boardHtml+=buildSubGroups(col,today,true); }
    boardHtml+='</div></div>';
  });
  boardHtml+='</div>';
  c.innerHTML='<div class="planner-wrap"><div class="planner-topbar">'+statsHtml+'</div>'+boardHtml+'</div>';
}
function buildSubGroups(node,today,topLevel){
  if(isLeaf(node)){
    const acs=filterAcoes(DB.acoes).filter(a=>a.nodeId===node.id);
    let h='<div class="bgrp"><div class="bgrp-hd" onclick="toggleGrp(this)">'+
      '<span class="bgrp-toggle">&#9660;</span>'+node.label+
      '<span class="bgrp-cnt">'+acs.length+'</span></div><div class="bgrp-items">';
    acs.forEach(a=>{h+=cardHTML(a,today);});
    h+='<button class="add-card-btn" onclick="openAM(\''+node.id+'\')">+ Adicionar ação</button></div></div>';
    return h;
  }
  let h='';
  if(node.children) node.children.forEach(child=>{h+=buildSubGroups(child,today,false);});
  return h;
}
function toggleGrp(hd){hd.closest('.bgrp').classList.toggle('collapsed');}
function cardHTML(a,today){
  const pct=a.progresso||0;
  const pfcls=a.status==='concluido'?'done':a.status==='em andamento'?'going':a.status==='cancelada'?'cancel':'pend';
  const sdcls=a.status==='concluido'?'sd-ok':a.status==='em andamento'?'sd-wn':a.status==='cancelada'?'sd-ca':'sd-pn';
  let dateLine='';
  if(a.dataFim){
    const end=parseBR(a.dataFim);
    if(end){
      const diff=Math.ceil((end-today)/86400000);
      if(a.status==='concluido') dateLine='<div class="ac-date">Concl. '+a.dataFim+'</div>';
      else if(diff<0) dateLine='<div class="ac-date ov">Venceu '+a.dataFim+'</div>';
      else if(diff===0) dateLine='<div class="ac-date" style="color:var(--WN);font-weight:600">Vence hoje</div>';
      else if(diff<=7) dateLine='<div class="ac-date">'+diff+'d restantes · '+a.dataFim+'</div>';
      else dateLine='<div class="ac-date">'+a.dataFim+'</div>';
    }
  }
  const prioSpan=a.prioridade==='alta'?'<span class="pri-a">Alta</span>'
    :a.prioridade==='media'?'<span class="pri-m">Média</span>'
    :'<span class="pri-b">Baixa</span>';
  return '<div class="acard '+pfcls+'" onclick="openAM(\'\',\''+a.id+'\')">'+
    '<div class="ac-t">'+a.titulo+'</div>'+

function renderNode(c,node,nid){

  const nodeAcs=_fa.filter(a=>dids.includes(a.nodeId));
  const directAcs=_fa.filter(a=>a.nodeId===nid);
  const tot=nodeAcs.length,done=nodeAcs.filter(a=>a.status==='concluido').length;
  const avgPr=tot?Math.round(nodeAcs.reduce((s,a)=>s+(a.progresso||0),0)/tot):0;
  const canA=CU.role==='admin'||isLeaf(node);
  let html='<div class="nh">'+
    '<div><h2>'+node.label+'</h2>'+
      '<div style="font-size:12.5px;color:var(--TM);margin-top:3px;padding-left:8px">'+nodePath(nid).join(' › ')+'</div></div>'+
    '<div class="nstats">'+
      '<div class="nstat" style="cursor:help" '+tipAttr(_tNAcoes(tot))+'><div class="nstat-v">'+tot+'</div><div class="nstat-l">Ações <span class="tip-i">i</span></div></div>'+
      '<div class="nstat" style="cursor:help" '+tipAttr(_tNConcl(done,tot))+'><div class="nstat-v" style="color:var(--OK)">'+done+'</div><div class="nstat-l">Concluídas <span class="tip-i">i</span></div></div>'+
      '<div class="nstat" style="cursor:help" '+tipAttr(_tNProg(avgPr))+'><div class="nstat-v" style="color:var(--P)">'+avgPr+'%</div><div class="nstat-l">Progresso <span class="tip-i">i</span></div></div>'+
    '</div></div>';
  if(node.children&&node.children.length){
    html+='<div class="sng">';
    node.children.forEach(ch=>{
      const cids=descIds(ch);
      const cnt=_fa.filter(a=>cids.includes(a.nodeId)).length;
      const cdone=_fa.filter(a=>cids.includes(a.nodeId)&&a.status==='concluido').length;
      const pct=cnt?Math.round(cdone/cnt*100):0;
      html+='<div class="snc" onclick="sv(\'node\',\''+ch.id+'\')">'+
        '<div class="snc-t">'+ch.label+'</div>'+
        '<div class="snc-c">'+cnt+' ação'+(cnt!==1?'ões':'')+'</div>'+
        (cnt?'<div class="pb" style="margin-top:9px"><div class="pf going" style="width:'+pct+'%"></div></div>'+
          '<div style="font-size:10.5px;color:var(--TM);margin-top:5px">'+cdone+'/'+cnt+' concluídas</div>':'')+'</div>';
    });
    html+='</div>';
  }
  html+='<div class="sc"><div class="sc-hd">'+scT('Ações nesta Seção',_tTabNode(directAcs))+
    (canA?'<button class="btn btn-P btn-sm" onclick="openAM(\''+nid+'\')">+ Nova Ação</button>':'')+
    '</div><div style="overflow:auto">'+tbl(directAcs,CU.role==='admin')+'</div></div>';
  if(tot>0){
    html+='<div class="cg2b"><div class="sc">'+
      '<div class="sc-hd">'+scT('Status (subárvore)',_tNodeSta(nodeAcs))+'</div>'+
      '<div class="sc-bd"><div class="ch-wrap sm"><canvas id="ncSta"></canvas></div></div></div>'+
    '<div class="sc"><div class="sc-hd">'+scT('Prioridades',_tNodePri(nodeAcs))+'</div>'+
      '<div class="sc-bd"><div class="ch-wrap sm"><canvas id="ncPri"></canvas></div></div>'+
    '</div></div>';
  }
  c.innerHTML=html;
  if(tot>0){
    setTimeout(()=>{
      const d=done,gn=nodeAcs.filter(a=>a.status==='em andamento').length,cx=nodeAcs.filter(a=>a.status==='cancelada').length,p=tot-done-gn-cx;
      const ctx1=g('ncSta');
      if(ctx1)new Chart(ctx1,{type:'doughnut',data:{labels:['Concluídas','Em Andamento','Pendentes','Canceladas'],
        datasets:[{data:[d,gn,p,cx],backgroundColor:['#15803D','#C4952A','#9CA3AF','#9D174D'],borderWidth:3,borderColor:'#fff'}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'65%',
          plugins:{legend:{position:'bottom',labels:{font:{size:11},usePointStyle:true,pointStyle:'circle',padding:12}}}}});
      const hi=nodeAcs.filter(a=>a.prioridade==='alta').length;
      const me=nodeAcs.filter(a=>a.prioridade==='media').length;
      const lo=nodeAcs.filter(a=>a.prioridade==='baixa').length;
      const ctx2=g('ncPri');
      if(ctx2)new Chart(ctx2,{type:'bar',data:{labels:['Alta','Média','Baixa'],
        datasets:[{data:[hi,me,lo],backgroundColor:['rgba(185,28,28,.72)','rgba(196,149,42,.72)','rgba(21,128,61,.72)'],borderRadius:6,borderSkipped:false}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{y:{beginAtZero:true,ticks:{stepSize:1,font:{size:11}},grid:{color:'#F0F3F8',drawBorder:false}},x:{grid:{display:false}}}}});
    },80);
  }
}

// ═══════════════════════════════════════════
// TABLE
// ═══════════════════════════════════════════
function tbl(acoes,isAdm){
  _TBLDATA=acoes;_TBLADM=isAdm;
  return '<div id="atHost">'+_tblHtml(acoes,isAdm)+'</div>';
}
function _cmpVal(a,key){
  if(key==='progresso')return Number(a.progresso)||0;
  if(key==='status'){const r={'pendente':0,'em andamento':1,'concluido':2,'cancelada':3};return (r[a.status]!=null)?r[a.status]:9;}
  if(key==='prioridade'){const r={'alta':0,'media':1,'baixa':2};return (r[a.prioridade]!=null)?r[a.prioridade]:9;}
  if(key==='data'){const d=parseBR(a.dataFim);return d?d.getTime():Infinity;}
  if(key==='numeroSEI')return String(a.numeroSEI||'').toLowerCase();
  if(key==='responsaveis')return String(a.responsaveis||a.responsavel||'').toLowerCase();
  return String(a.titulo||'').toLowerCase();
}
function _sortAc(acoes){
  if(!TBLSORT.key)return acoes.slice();
  const k=TBLSORT.key,d=TBLSORT.dir;
  return acoes.slice().sort((x,y)=>{const vx=_cmpVal(x,k),vy=_cmpVal(y,k);
    if(vx<vy)return -d;if(vx>vy)return d;return 0;});
}
function _th(label,key){
  const act=TBLSORT.key===key,ar=act?(TBLSORT.dir>0?' ▲':' ▼'):'';
  return '<th onclick="sortTbl(\''+key+'\')" style="cursor:pointer;user-select:none;white-space:nowrap">'+
    label+'<span style="color:var(--G);font-size:10px">'+ar+'</span></th>';
}
function sortTbl(key){
  if(TBLSORT.key===key)TBLSORT.dir=-TBLSORT.dir;else{TBLSORT.key=key;TBLSORT.dir=1;}
  const h=g('atHost');if(h)h.innerHTML=_tblHtml(_TBLDATA,_TBLADM);
}
function secHdr(t,b,mt){
  return '<div style="display:flex;align-items:center;gap:10px;margin:'+(mt==null?22:mt)+'px 0 14px">'+
    '<span style="font-size:13px;font-weight:700;color:var(--P);letter-spacing:.3px">'+t+'</span>'+
    '<span style="flex:1;height:1px;background:var(--BD)"></span>'+
    (b?'<span class="badge b-nm">'+b+'</span>':'')+'</div>';
}

function _tblHtml(acoes,isAdm){
  if(!acoes.length)return '<div class="empty"><div class="ei">∅</div>'+
    '<h3>Nenhuma ação cadastrada</h3><p>Clique em "Nova Ação" para começar.</p></div>';
  const today=new Date();today.setHours(0,0,0,0);
  const rows=_sortAc(acoes).map(a=>{
    const sb=a.status==='concluido'?'<span class="badge b-ok">Concluído</span>'
      :a.status==='em andamento'?'<span class="badge b-wn">Em Andamento</span>'
      :a.status==='cancelada'?'<span class="badge b-ca">Cancelada</span>'
      :'<span class="badge b-pn">Pendente</span>';
    const pr=a.prioridade==='alta'?'<span class="pri-a">Alta</span>'
      :a.prioridade==='media'?'<span class="pri-m">Média</span>'
      :'<span class="pri-b">Baixa</span>';
    let dc='';
    if(a.dataFim){const end=parseBR(a.dataFim);if(end){
      const diff=Math.ceil((end-today)/86400000);
      if(a.status==='concluido')dc='<span class="tc">'+a.dataFim+'</span>';
      else if(diff<0)dc='<span class="tc ov">Vencida '+a.dataFim+'</span>';
      else if(diff===0)dc='<span class="tc td">Vence hoje</span>';
      else if(diff<=7)dc='<span class="tc up">'+diff+'d restantes</span>';
      else dc='<span class="tc">'+a.dataFim+'</span>';
    }}
    const path=nodePath(a.nodeId);const pathStr=path.slice(1).join(' › ')||'—';
    const pct=a.progresso||0;
    const pfcls=a.status==='concluido'?'done':a.status==='em andamento'?'going':a.status==='cancelada'?'cancel':'pend';
    const btnE='<button class="btn btn-gh btn-sm" onclick="openAM(\'\',\''+a.id+'\')">Editar</button>';
    const btnAr=isAdm?'<button class="btn btn-gh btn-sm" onclick="arquivar(\''+a.id+'\')">Arquivar</button>':'';
    const btnD='<button class="btn btn-er btn-sm" onclick="excluir(\''+a.id+'\')">Excluir</button>';
    const resps=String(a.responsaveis||a.responsavel||'').split(',').map(s=>s.trim()).filter(Boolean);
    const respHtml=resps.length?resps.map(r=>'<div style="font-size:11.5px;color:var(--TX-2)">'+r+'</div>').join(''):'—';
    return '<tr>'+
      '<td><div class="at-title">'+a.titulo+'</div><div class="at-sub">'+pathStr+'</div></td>'+
      '<td style="font-size:11px;color:var(--IN);white-space:nowrap;font-weight:600">'+(a.numeroSEI||'—')+'</td>'+
      '<td>'+sb+'</td><td>'+pr+'</td>'+
      '<td style="width:110px">'+
        '<div style="font-size:10.5px;color:var(--TM);text-align:right;margin-bottom:4px;font-weight:600">'+pct+'%</div>'+
        '<div class="pb"><div class="pf '+pfcls+'" style="width:'+pct+'%"></div></div></td>'+
      '<td>'+respHtml+'</td>'+
      '<td><div style="font-size:12px;color:var(--TM-2);margin-bottom:3px">'+(a.dataIni||'—')+'</div>'+dc+'</td>'+
      '<td><div class="at-act">'+btnE+btnAr+btnD+'</div></td></tr>';
  }).join('');
  return '<table class="at"><thead><tr>'+
    _th('Ação','titulo')+_th('SEI','numeroSEI')+_th('Status','status')+
    _th('Prioridade','prioridade')+_th('Progresso','progresso')+
    _th('Responsáveis','responsaveis')+_th('Datas','data')+'<th></th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table>';
}

async function salvarSenha(){
  const pa=g('prfPA').value,pn=g('prfPN').value;
  if(!pn||pn.length<6){toast('A nova senha deve ter ao menos 6 caracteres.','er');return;}
  try{
    const res=await sbCall('sb_change_password',{p_token:TOKEN,p_target_id:CU.id,p_atual:pa,p_nova:pn});
    if(res.ok){toast('Senha alterada com sucesso.','ok');g('prfPA').value='';g('prfPN').value='';}
    else toast(res.msg||'Erro ao alterar senha.','er');
  }catch(e){toast('Erro: '+e.message,'er');}
}

function openAM(nodeId,acaoId){
  const sel=g('amNode');
  sel.innerHTML='<option value="">— Selecione a seção —</option>';
  allNodes().forEach(n=>{
    const path=nodePath(n.id);
    const opt=document.createElement('option');
    opt.value=n.id;opt.textContent=path.slice(1).join(' › ');
    sel.appendChild(opt);
  });
  const rsel=g('amRespSel');
  rsel.innerHTML='<option value="">+ Adicionar responsável da lista…</option>';
  DB.users.forEach(u=>{
    const o=document.createElement('option');
    o.value=u.name||u.nome;o.textContent=u.name||u.nome;
    rsel.appendChild(o);
  });
  _respSel=[];renderRespTags();
  if(acaoId){
    const a=DB.acoes.find(x=>x.id===acaoId);if(!a)return;
    g('amTitle').textContent='Editar Ação';g('amId').value=acaoId;
    g('amTit').value=a.titulo;g('amNode').value=a.nodeId;
    g('amSEI').value=a.numeroSEI||'';
    _respSel=String(a.responsaveis||a.responsavel||'').split(',').map(s=>s.trim()).filter(Boolean);
    renderRespTags();g('amIni').value=a.dataIni||'';
    g('amFim').value=a.dataFim||'';g('amPri').value=a.prioridade||'media';
    g('amSta').value=a.status||'pendente';g('amProg').value=a.progresso||0;
    g('amObs').value=a.obs||'';g('amImp').value=a.impacto!=null?String(a.impacto):'';updPr(a.progresso||0);
  }else{
    g('amTitle').textContent='Nova Ação';g('amId').value='';
    ['amTit','amIni','amFim','amObs','amSEI'].forEach(id=>{g(id).value='';});
    g('amNode').value=nodeId||'';_respSel=[CU.name];renderRespTags();
    g('amPri').value='media';g('amSta').value='pendente';
    g('amImp').value='';g('amProg').value=0;updPr(0);
  }
  g('am').classList.add('open');
}

async function saveAcao(){
  const titulo=g('amTit').value.trim(),nodeId=g('amNode').value;
  const dataIni=g('amIni').value.trim(),dataFim=g('amFim').value.trim();
  const prioridade=g('amPri').value,status=g('amSta').value;
  const progresso=parseInt(g('amProg').value)||0;
  const obs=g('amObs').value.trim(),editId=g('amId').value;
  const numeroSEI=g('amSEI').value.trim();
  const impacto=g('amImp').value;
  const responsaveis=_respSel.length?_respSel.join(','):'';
  const responsavel=_respSel[0]||'';
  if(!titulo){toast('O título da ação é obrigatório.','er');return;}
  if(!nodeId){toast('Selecione a seção onde a ação pertence.','er');return;}
  if(dataIni&&!validBR(dataIni)){toast('Data de início inválida. Use DD/MM/AAAA.','er');return;}
  if(dataFim&&!validBR(dataFim)){toast('Data de conclusão inválida. Use DD/MM/AAAA.','er');return;}
  cm('am');
  try{
    let res;
    if(editId){
      res=await sbCall('sb_update_acao',{
        p_token:TOKEN,p_id:editId,
        p_node_id:nodeId,p_titulo:titulo,
        p_responsavel:responsavel,p_responsaveis:responsaveis,
        p_data_ini:dataIni,p_data_fim:dataFim,
        p_prioridade:prioridade,p_status:status,
        p_progresso:progresso/100,p_obs:obs,p_numero_sei:numeroSEI
      });
      if(res.ok)toast('Ação atualizada.','ok');
      else{toast(res.msg||'Erro ao atualizar.','er');return;}
    }else{
      if(CU.role!=='admin'){
        const node=findN(nodeId,TREE);
        if(node&&node.children&&node.children.length){
          toast('Usuários comuns só podem criar ações em seções finais.','er');return;
        }
      }
      res=await sbCall('sb_create_acao',{
        p_token:TOKEN,
        p_node_id:nodeId,p_titulo:titulo,
        p_responsavel:responsavel,p_responsaveis:responsaveis,
        p_data_ini:dataIni,p_data_fim:dataFim,
        p_prioridade:prioridade,p_status:status,
        p_progresso:progresso/100,p_obs:obs,p_numero_sei:numeroSEI
      });
      if(res.ok)toast('Ação criada com sucesso.','ok');
      else{toast(res.msg||'Erro ao criar ação.','er');return;}
    }
    // grava o Impacto Institucional via função isolada (não interfere no create/update acima)
    const _impId=editId||(res&&res.id);
    if(_impId){
      const _impVal=(impacto==='')?null:parseInt(impacto,10);
      try{ await sbCall('sb_set_impacto',{p_token:TOKEN,p_id:_impId,p_impacto:_impVal}); }catch(_e){}
    }
    await loadFromSupabase();
    refreshView();
  }catch(e){toast('Erro: '+e.message,'er');}
}

function buildUserFilter(){

  sel.innerHTML='<option value="">Todos</option>';
  if(CU.role==='admin'){
    DB.users.forEach(u=>{

      o.value=u.name||u.nome;o.textContent=u.name||u.nome;
      sel.appendChild(o);
    });
  }else{
    const o=document.createElement('option');
    o.value=CU.name;o.textContent='Eu ('+CU.name+')';
    sel.appendChild(o);

function filterAcoes(list){
  let r=list?[...list]:[...DB.acoes];
  if(FLT.user){
    r=r.filter(a=>{
      const resp=String(a.responsaveis||a.responsavel||'');
      return resp.split(',').map(s=>s.trim()).includes(FLT.user);
    });
  }
  if(FLT.sei){
    r=r.filter(a=>String(a.numeroSEI||'').toLowerCase().includes(FLT.sei.toLowerCase()));
  }
  if(FLT.dateIni||FLT.dateFim){
    const fIni=FLT.dateIni?parseBR(FLT.dateIni):null;
    const fFim=FLT.dateFim?parseBR(FLT.dateFim):null;
    if(fIni)fIni.setHours(0,0,0,0);
    if(fFim)fFim.setHours(23,59,59,999);
    r=r.filter(a=>{
      const raw=String(a.criado||a.atualizado||'').trim();
      if(!raw)return false;
      let criado=null;
      if(/^\d{2}\/\d{2}\/\d{4}/.test(raw)){
        criado=parseBR(raw.slice(0,10));
      }else if(/^\d{4}-\d{2}-\d{2}/.test(raw)){
        const p=raw.slice(0,10).split('-').map(Number);
        criado=new Date(p[0],p[1]-1,p[2]);
      }
      if(!criado||isNaN(criado.getTime()))return false;
      criado.setHours(0,0,0,0);
      if(fIni&&criado<fIni)return false;
      if(fFim&&criado>fFim)return false;
      return true;
    });
  }
  return r;
}
function mdateFlt(input){
  let v=input.value.replace(/\D/g,'');
  if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);
  if(v.length>=6)v=v.slice(0,5)+'/'+v.slice(5);
  input.value=v.slice(0,10);
  const calId=input.id==='fltIni'?'fltIniCal':'fltFimCal';
  if(validBR(input.value)){
    const p=input.value.split('/');
    const cal=g(calId);if(cal)cal.value=p[2]+'-'+p[1]+'-'+p[0];
  }
  if(v.replace(/\D/g,'').length===8)applyFilter();
}
function calToText(calId,txtId){

  const p=cal.value.split('-');
  const txt=g(txtId);if(txt)txt.value=p[2]+'/'+p[1]+'/'+p[0];
  applyFilter();
}
function seiSearch(q){
  const drop=g('seiDrop');if(!drop)return;
  q=(q||'').trim();
  const todos=[...new Set(
    [...DB.acoes,...(DB.arquivadas||[])]
      .map(a=>String(a.numeroSEI||'').trim()).filter(Boolean)
  )];
  const matches=q?todos.filter(s=>s.toLowerCase().includes(q.toLowerCase())):todos;
  if(!matches.length){drop.className='sei-drop';return;}
  drop.innerHTML=matches.slice(0,20).map(s=>{
    const hl=q?s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):s;
    return '<div class="sei-opt" onclick="seiSelect(\''+s.replace(/'/g,"\\'")+'\')">'+hl+'</div>';
  }).join('');
  drop.className='sei-drop open';
}
function seiSelect(val){
  const inp=g('fltSEI');if(inp)inp.value=val;
  const drop=g('seiDrop');if(drop)drop.className='sei-drop';
  FLT.sei=val;applyFilter();

document.addEventListener('click',e=>{

function applyFilter(){
  FLT.user=g('fltUser')?.value||'';
  const rawIni=g('fltIni')?.value||'';
  const rawFim=g('fltFim')?.value||'';
  FLT.dateIni=validBR(rawIni)?rawIni:'';
  FLT.dateFim=validBR(rawFim)?rawFim:'';
  FLT.sei=(g('fltSEI')?.value||'').trim();
  const active=FLT.user||FLT.dateIni||FLT.dateFim||FLT.sei;
  const fb=g('fbar');if(fb)fb.className='fbar'+(active?' fbar-active':'');
  const clr=g('fltClear');if(clr)clr.style.display=active?'':'none';
  const tag=g('fltTag');
  if(tag){
    tag.style.display=active?'':'none';
    const parts=[];
    if(FLT.user)parts.push(FLT.user);
    if(FLT.dateIni)parts.push('de '+FLT.dateIni);
    if(FLT.dateFim)parts.push('até '+FLT.dateFim);
    tag.textContent='Filtrando: '+parts.join(' · ');
  }
  refreshView();
}
function clearFilter(){
  FLT={user:'',dateIni:'',dateFim:'',sei:''};
  ['fltUser','fltIni','fltFim','fltIniCal','fltFimCal','fltSEI'].forEach(id=>{if(g(id))g(id).value='';});

}
function herdarSEI(){
  const nodeId=g('amNode').value;
  if(!nodeId){toast('Selecione primeiro a seção.','er');return;}
  const ancestors=(ancestorIds(nodeId,TREE)||[]).filter(id=>id!=='root');
  if(!ancestors.length){toast('Nenhum nível superior encontrado.','in');return;}
  const found=DB.acoes.filter(a=>ancestors.includes(a.nodeId)&&a.numeroSEI&&String(a.numeroSEI).trim());
  if(!found.length){toast('Nenhum SEI encontrado no nível superior.','in');return;}
  found.sort((a,b)=>new Date(b.atualizado||0)-new Date(a.atualizado||0));
  g('amSEI').value=found[0].numeroSEI;
  toast('SEI importado: '+found[0].numeroSEI,'ok');
}
